<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TONY MUSIC</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0a0a0a;color:#fff;padding:15px;padding-bottom:120px}
  h1{text-align:center;color:#ff2d55;font-size:26px;margin:5px 0}
  p{text-align:center;color:#aaa;font-size:13px;margin-bottom:15px}
  .search{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:15px;margin-bottom:12px;outline:none}
  .card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;color:#ff2d55;margin-bottom:10px}
  .song{display:flex;align-items:center;gap:12px;padding:11px;background:#222;border-radius:12px;margin-bottom:8px;cursor:pointer}
  .song.active{background:#ff2d55}
  .cover{width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,#ff2d55,#ff9500);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0}
  .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .info span{font-size:12px;color:#aaa}
  .song.active .info span{color:#fff}
  .playbtn{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
  input[type=file]{width:100%;background:#222;padding:10px;border-radius:10px;color:#fff;margin-top:8px}
  .player{position:fixed;bottom:0;left:0;right:0;background:#161616;border-top:1px solid #333;padding:12px 15px}
  .player-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .player-top .cover{width:44px;height:44px}
  .controls{display:flex;justify-content:center;gap:15px;align-items:center;margin:8px 0}
  .controls button{border:none;cursor:pointer;background:#222;color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px}
  .controls button.main{background:#ff2d55;width:58px;height:58px;font-size:24px;color:#fff}
  input[type=range]{width:100%;accent-color:#ff2d55}
  .time{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:4px}
  .chip{display:inline-block;background:#222;border:1px solid #333;padding:7px 12px;border-radius:20px;font-size:12px;margin:0 5px 5px 0;cursor:pointer}
  .chip.active{background:#ff2d55;border-color:#ff2d55}
</style>
</head>
<body>

<h1>🎵 TONY MUSIC</h1>
<p>Tu música, sin anuncios, sin llave, sin internet</p>

<input class="search" id="buscar" placeholder="🔍 Buscar canción..." oninput="filtrar()">

<div class="card">
  <h2>🎧 Mis canciones</h2>
  <div>
    <span class="chip active" onclick="filtrarCat('todo',this)">Todo</span>
    <span class="chip" onclick="filtrarCat('corridos',this)">Corridos</span>
    <span class="chip" onclick="filtrarCat('reggaeton',this)">Reggaetón</span>
    <span class="chip" onclick="filtrarCat('rap',this)">Rap / Trap</span>
  </div>
  <div id="lista" style="margin-top:10px"></div>
</div>

<div class="card">
  <h2>➕ Agregar tus canciones</h2>
  <p style="text-align:left;color:#ccc;font-size:12px;margin-bottom:5px">Elige tus MP3 de tu celular y se agregan al momento.</p>
  <input type="file" id="file" accept="audio/*" multiple>
  <button onclick="document.getElementById('file').click()" style="width:100%;padding:12px;border:none;border-radius:12px;background:#ff2d55;color:#fff;font-weight:bold;margin-top:10px">📂 ELEGIR MÚSICA DE MI CEL</button>
</div>

<div class="player">
  <div class="player-top">
    <div class="cover" id="coverPlayer">🎵</div>
    <div class="info" style="flex:1">
      <b id="titulo">Elige una canción bro</b>
      <span id="artista">TONY MUSIC</span>
    </div>
    <span id="like" onclick="like()" style="font-size:22px;cursor:pointer">🤍</span>
  </div>
  <input type="range" id="progreso" value="0" min="0" max="100" oninput="saltar(this.value)">
  <div class="time"><span id="actual">0:00</span><span id="total">0:00</span></div>
  <div class="controls">
    <button onclick="anterior()">⏮</button>
    <button class="main" id="btnPlay" onclick="playPause()">▶</button>
    <button onclick="siguiente()">⏭</button>
    <button onclick="aleatorio()" style="font-size:14px">🔀</button>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span>🔈</span><input type="range" id="vol" min="0" max="100" value="80" oninput="volumen(this.value)"><span>🔊</span>
  </div>
</div>

<audio id="audio"></audio>

<script>
let canciones = [
  {titulo:"Corridos Tumbados Mix", artista:"TONY", cat:"corridos", emoji:"🎸", url:""},
  {titulo:"Reggaetón Para Jugar", artista:"TONY", cat:"reggaeton", emoji:"🔥", url:""},
  {titulo:"Trap Focus - Para Subir Rango", artista:"TONY", cat:"rap", emoji:"🎤", url:""},
  {titulo:"Bélico Mix 2026", artista:"TONY", cat:"corridos", emoji:"🤠", url:""},
];
let actual = -1;
let catActual = 'todo';
let liked = false;
let audio = document.getElementById('audio');

function mostrar(){
  let q = document.getElementById('buscar').value.toLowerCase();
  let html = '';
  canciones.forEach((c,i)=>{
    if(catActual!=='todo' && c.cat!==catActual) return;
    if(q && !c.titulo.toLowerCase().includes(q)) return;
    html += `<div class="song ${i===actual?'active':''}" onclick="tocar(${i})">
      <div class="cover">${c.emoji}</div>
      <div class="info"><b>${c.titulo}</b><span>${c.artista} • ${c.cat}</span></div>
      <div class="playbtn">${i===actual?'⏸':'▶'}</div>
    </div>`;
  });
  if(!html) html = '<p style="color:#888;font-size:13px">No hay canciones. Agrégalas abajo 👇</p>';
  document.getElementById('lista').innerHTML = html;
}
function filtrar(){ mostrar(); }
function filtrarCat(cat, el){
  catActual = cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  mostrar();
}
function tocar(i){
  actual = i;
  let c = canciones[i];
  document.getElementById('titulo').innerText = c.titulo;
  document.getElementById('artista').innerText = c.artista;
  document.getElementById('coverPlayer').innerText = c.emoji;
  if(!c.url){
    alert('Bro, esta es de ejemplo. Agrega tus MP3 abajo y esa sí va a sonar.');
    mostrar();
    return;
  }
  audio.src = c.url;
  audio.play();
  document.getElementById('btnPlay').innerText = '⏸';
  mostrar();
}
function playPause(){
  if(actual===-1){ tocar(0); return; }
  if(audio.paused){ audio.play(); document.getElementById('btnPlay').innerText='⏸'; }
  else { audio.pause(); document.getElementById('btnPlay').innerText='▶'; }
}
function siguiente(){
  if(canciones.length===0) return;
  tocar((actual+1)%canciones.length);
}
function anterior(){
  if(canciones.length===0) return;
  tocar((actual-1+canciones.length)%canciones.length);
}
function aleatorio(){ tocar(Math.floor(Math.random()*canciones.length)); }
function like(){
  liked = !liked;
  document.getElementById('like').innerText = liked?'❤️':'🤍';
}
function volumen(v){ audio.volume = v/100; }
function saltar(v){ if(audio.duration) audio.currentTime = (v/100)*audio.duration; }
audio.ontimeupdate = ()=>{
  if(!audio.duration) return;
  document.getElementById('progreso').value = (audio.currentTime/audio.duration)*100;
  document.getElementById('actual').innerText = fmt(audio.currentTime);
  document.getElementById('total').innerText = fmt(audio.duration);
};
audio.onended = ()=> siguiente();
function fmt(s){ let m=Math.floor(s/60); let sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

document.getElementById('file').onchange = e=>{
  let files = [...e.target.files];
  files.forEach(f=>{
    let url = URL.createObjectURL(f);
    canciones.push({titulo:f.name.replace('.mp3','').replace('.m4a',''), artista:'Mi Celular', cat:'todo', emoji:'🎵', url:url});
  });
  alert('Listo bro! Se agregaron '+files.length+' canciones. Ya puedes ponerles play.');
  mostrar();
};
mostrar();
</script>
</body>
</html>
